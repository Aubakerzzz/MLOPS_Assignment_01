name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # -----------------------
      # Build services
      # -----------------------
      - name: Build Docker Compose services
        run: docker compose build

      # -----------------------
      # Start services
      # -----------------------
      - name: Start services
        run: docker compose up -d

      - name: Wait for DB to initialize
        run: |
          echo "⏳ Waiting for MySQL + init.sql ..."
          sleep 25

      # -----------------------
      # Run backend tests
      # -----------------------
      - name: Run backend tests
        run: docker compose run --rm backend pytest -v

      # -----------------------
      # Shut down services
      # -----------------------
      - name: Stop services
        if: always()
        run: docker compose down